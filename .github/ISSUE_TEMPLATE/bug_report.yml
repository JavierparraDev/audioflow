name: Bug report
description: Report a device, app or crash problem with AudioFlow.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AudioFlow! Please read the
        [known limitations](https://github.com/JavierparraDev/audioflow/blob/main/docs/LIMITATIONS.md)
        first — many routing behaviours are expected in the current beta.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I have read the known limitations and the roadmap.
          required: true
        - label: I am running the latest version of AudioFlow.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open AudioFlow
        2. Select ...
        3. Start ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: "Windows 11 23H2 (build 22631.4460)"
    validations:
      required: true
  - type: input
    id: audioflow-version
    attributes:
      label: AudioFlow version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Audio devices involved
      description: Output devices (make/model), and whether they are USB, Bluetooth, virtual, etc.
      placeholder: "Realtek onboard speakers, HyperX Cloud II USB headset, Voicemeeter"
    validations:
      required: true
  - type: textarea
    id: apps
    attributes:
      label: Applications involved
      placeholder: "Spotify 1.2.31, Discord, Chrome, game name"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics output
      description: Paste the output of `audioflow diagnostics` or `audioflow session` if relevant.
      render: text
    validations:
      required: false
  - type: dropdown
    id: backend
    attributes:
      label: Routing backend
      options:
        - Policy Endpoint (default)
        - Virtual Endpoint
        - Not sure
    validations:
      required: false
